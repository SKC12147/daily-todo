<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><meta name="description" content="A simple daily to-do list that stays on your phone.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<title>Daily To-Do</title>
<style>
:root{color-scheme:light;--blue:#2563eb;--ink:#172033;--muted:#697386;--line:#e5e9f2;--bg:#f4f7fc;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:28px 20px 26px;border-radius:0 0 25px 25px}header .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:700}h1{margin:7px 0 4px;font-size:29px;letter-spacing:-.7px}#today{opacity:.9;font-size:14px}.wrap{max-width:620px;margin:0 auto;padding:18px 16px 40px}.stats{display:flex;gap:10px;margin-top:-3px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:12px 14px;flex:1}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.composer{background:white;border:1px solid var(--line);padding:12px;border-radius:16px;display:flex;gap:8px;box-shadow:0 5px 18px #1720330a}.composer input{min-width:0;flex:1;border:0;outline:0;font:inherit;padding:9px 5px;color:var(--ink)}button{font:inherit;cursor:pointer;border:0}.add{background:var(--blue);color:#fff;font-weight:700;padding:0 18px;border-radius:11px}.tools{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px;gap:10px}.filters{display:flex;gap:5px}.filter{padding:8px 11px;border-radius:10px;color:var(--muted);background:transparent;font-size:13px}.filter.active{background:#e7edff;color:#244ed2;font-weight:700}.clear{background:transparent;color:var(--muted);font-size:12px;padding:8px 0}.list{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px}.task input[type=checkbox]{width:21px;height:21px;accent-color:var(--blue);flex-shrink:0}.task-text{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}.task.done .task-text{text-decoration:line-through;color:#9aa3b2}.delete{font-size:20px;color:#9aa3b2;background:transparent;padding:4px 7px;border-radius:8px}.delete:active{background:#fee2e2;color:#b91c1c}.empty{text-align:center;padding:35px 18px;color:var(--muted);background:#ffffffa8;border:1px dashed #cfd7e6;border-radius:15px}.empty .emoji{font-size:30px;margin-bottom:8px}.footer{text-align:center;color:#8790a0;font-size:12px;margin-top:22px}.small-btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted);font-size:12px}#install{display:none;background:#eff6ff;border:1px solid #bfdbfe;border-radius:13px;padding:12px;margin-bottom:14px;font-size:13px;color:#1e40af}#install button{background:#2563eb;color:white;border-radius:8px;padding:7px 10px;margin-left:8px}@media(min-width:560px){header{padding-left:max(20px,calc((100% - 588px)/2));padding-right:max(20px,calc((100% - 588px)/2))}}
</style>
</head>
<body>
<header><div class="eyebrow">Your day, your plan</div><h1>Daily To-Do ✓</h1><div id="today"></div></header>
<main class="wrap">
<div id="install"><strong>Install this app</strong><span> Add it to your home screen for quick access.</span><button id="installBtn">Install</button></div>
<section class="stats"><div class="stat"><strong id="total">0</strong><span>Tasks today</span></div><div class="stat"><strong id="doneCount">0</strong><span>Completed</span></div><div class="stat"><strong id="leftCount">0</strong><span>Left to do</span></div></section>
<form class="composer" id="taskForm"><input id="taskInput" maxlength="180" placeholder="What do you need to do?" autocomplete="off" aria-label="New task" required><button class="add" type="submit">+ Add</button></form>
<div class="tools"><div class="filters" aria-label="Filter tasks"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">To do</button><button class="filter" data-filter="done">Done</button></div><button class="clear" id="clearDone">Clear completed</button></div>
<div class="list" id="taskList"></div>
<div class="footer">Your tasks are saved on this device. No account needed.</div>
</main>
<script>
const KEY='daily-todo-v1';let tasks=[];let filter='all';
const $=id=>document.getElementById(id);
function dateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'{}');tasks=data.date===dateKey()?(data.tasks||[]):[];}catch{tasks=[]}save();}
function save(){localStorage.setItem(KEY,JSON.stringify({date:dateKey(),tasks}));}
function render(){const done=tasks.filter(t=>t.done).length;$('total').textContent=tasks.length;$('doneCount').textContent=done;$('leftCount').textContent=tasks.length-done;const list=$('taskList');list.replaceChildren();const shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));if(!shown.length){const empty=document.createElement('div');empty.className='empty';const emoji=document.createElement('div');emoji.className='emoji';emoji.textContent=tasks.length?'🌿':'📝';const title=document.createElement('strong');title.textContent=tasks.length?'Nothing here':'Start with one small task';const p=document.createElement('div');p.style.marginTop='6px';p.textContent=tasks.length?'Try another filter.':'Add your first task above and make today count.';empty.append(emoji,title,p);list.append(empty);return;}shown.forEach(t=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label','Mark task complete');check.addEventListener('change',()=>{t.done=check.checked;save();render()});const text=document.createElement('div');text.className='task-text';text.textContent=t.text;const del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','Delete task');del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()});row.append(check,text,del);list.append(row)});}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const input=$('taskInput');const text=input.value.trim();if(!text)return;tasks.unshift({id:Date.now()+Math.random(),text,done:false});input.value='';save();render();input.focus()});
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));render()}));
$('clearDone').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render()});
$('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});load();render();
let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='block'});$('installBtn').addEventListener('click',async()=>{if(!installPrompt){alert('Open this app in Chrome, tap ⋮, then choose “Add to Home screen” or “Install app”.');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').style.display='none'});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
